<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account - Kharcha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/ico" sizes="16x16" href="/static/app.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
    })();
  </script>
</head>
<body>
  <div class="auth-layout">
    <section class="auth-brand">
      <h1 class="auth-wordmark"><img src="/static/favicon.png" alt="logo" ></h1>
      <p>Log every expense, watch your monthly total and stay inside your budget.</p>
    </section>

    <main class="auth-form-wrap">
      <div class="auth-form">
        <h2>Create account</h2>

        {% if error %}
          <p class="form-error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('register') }}">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" minlength="3" maxlength="30" autocomplete="username"
                   value="{{ username or '' }}" required autofocus>
            <p class="hint">3 to 30 characters.</p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
            <p class="hint">At least 6 characters.</p>
          </div>
          <div class="field">
            <label for="security_question">Security question</label>
            <select id="security_question" name="security_question" required>
              <option value="" disabled {{ 'selected' if not question else '' }}>Choose a question</option>
              {% for q in questions %}
                <option value="{{ q }}" {{ 'selected' if q == question else '' }}>{{ q }}</option>
              {% endfor %}
            </select>
            <p class="hint">Used to reset your password if you forget it.</p>
          </div>
          <div class="field">
            <label for="security_answer">Answer</label>
            <input id="security_answer" name="security_answer" type="text" maxlength="100" autocomplete="off" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
      </div>
    </main>
  </div>
</body>
</html>
